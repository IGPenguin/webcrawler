name: CI

on:
  push:
    branches: [ live ]
  pull_request:
    branches: [ live ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run CSV and Version Validation
      run: |
        # Get the base branch config if this is a PR
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          # Try to find where the version code was in the base branch (it moved around during refactoring)
          if git show origin/${{ github.base_ref }}:js/constants.js > base_config.js 2>/dev/null; then
            echo "Found version in js/constants.js on base branch"
          elif git show origin/${{ github.base_ref }}:js/game_loop.js > base_config.js 2>/dev/null; then
            echo "Found version in js/game_loop.js on base branch"
          elif git show origin/${{ github.base_ref }}:js/config.js > base_config.js 2>/dev/null; then
            echo "Found version in js/config.js on base branch"
          else
            echo "Warning: Could not find base version file on origin/${{ github.base_ref }}"
            touch base_config.js
          fi
          python validator.py js/constants.js base_config.js
        else
          # On live branch, just validate CSVs without version comparison
          python validator.py
        fi
