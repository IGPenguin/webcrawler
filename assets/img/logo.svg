<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 5 380 125" width="560" height="184" style="overflow:visible">
  <defs>
    <style>
      @font-face {
        font-family: 'Tiny5';
        src: url('data:font/woff2;base64,') format('woff2');
      }
      @keyframes drop-fall {
        0%   { transform: translateY(0);   opacity: 0; }
        6%   { transform: translateY(4px);  opacity: 1; animation-timing-function: steps(8); }
        72%  { transform: translateY(36px); opacity: 0.1; animation-timing-function: steps(4); }
        100% { transform: translateY(44px); opacity: 0; }
      }
      .d1 { animation: drop-fall 2.8s steps(8) infinite  0.0s both; }
      .d2 { animation: drop-fall 3.3s steps(8) infinite  0.9s both; }
      .d3 { animation: drop-fall 2.4s steps(8) infinite  1.7s both; }
      .d4 { animation: drop-fall 3.0s steps(8) infinite  1.2s both; }
      .d5 { animation: drop-fall 2.6s steps(8) infinite  0.4s both; }
    </style>
  </defs>
  <!-- Pixel blood drops -->
  <path class="d1" d="M 68,82 H 72 V 86 H 75 V 90 H 77 V 95 H 74 V 98 H 66 V 95 H 63 V 90 H 65 V 86 H 68 Z" fill="#9B0000" stroke="#000" stroke-width="1.5"/>
  <path class="d2" d="M 150,82 H 154 V 86 H 157 V 90 H 159 V 95 H 156 V 98 H 148 V 95 H 145 V 90 H 147 V 86 H 150 Z" fill="#9B0000" stroke="#000" stroke-width="1.5"/>
  <path class="d3" d="M 198,82 H 202 V 86 H 205 V 90 H 207 V 95 H 204 V 98 H 196 V 95 H 193 V 90 H 195 V 86 H 198 Z" fill="#9B0000" stroke="#000" stroke-width="1.5"/>
  <path class="d4" d="M 266,82 H 270 V 86 H 273 V 90 H 275 V 95 H 272 V 98 H 264 V 95 H 261 V 90 H 263 V 86 H 266 Z" fill="#9B0000" stroke="#000" stroke-width="1.5"/>
  <path class="d5" d="M 336,82 H 340 V 86 H 343 V 90 H 345 V 95 H 342 V 98 H 334 V 95 H 331 V 90 H 333 V 86 H 336 Z" fill="#9B0000" stroke="#000" stroke-width="1.5"/>
  <!-- Title text -->
  <text x="190" y="76"
    text-anchor="middle"
    font-family="'Tiny5', sans-serif"
    font-size="72" font-weight="400"
    fill="#CC0000" stroke="#000000" stroke-width="6"
    paint-order="stroke fill" letter-spacing="2">Stay Dead</text>
</svg>
