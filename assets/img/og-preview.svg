<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @font-face {
        font-family: 'Tiny5';
        src: url('data:font/woff2;base64,') format('woff2');
      }
    </style>
    <radialGradient id="bg" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#1c0a0a"/>
      <stop offset="100%" stop-color="#060202"/>
    </radialGradient>
    <!-- Blood drop 2x scale: 28px wide x 32px tall, centered at (0,0) -->
    <path id="drop"
          d="M -4,0 H 4 V 8 H 10 V 16 H 14 V 26 H 8 V 32 H -8 V 26 H -14 V 16 H -10 V 8 H -4 Z"
          fill="#9B0000" stroke="#1a0000" stroke-width="1.5"/>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Pixel border outer -->
  <rect x="8" y="8" width="1184" height="614" fill="none" stroke="#2e0e0e" stroke-width="4"/>
  <!-- Pixel border inner thin -->
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#180808" stroke-width="2"/>
  <!-- Corner squares -->
  <rect x="8"    y="8"   width="16" height="16" fill="#3d1212"/>
  <rect x="1176" y="8"   width="16" height="16" fill="#3d1212"/>
  <rect x="8"    y="606" width="16" height="16" fill="#3d1212"/>
  <rect x="1176" y="606" width="16" height="16" fill="#3d1212"/>
  <rect x="24"   y="24"  width="8"  height="8"  fill="#2a0c0c"/>
  <rect x="1168" y="24"  width="8"  height="8"  fill="#2a0c0c"/>
  <rect x="24"   y="598" width="8"  height="8"  fill="#2a0c0c"/>
  <rect x="1168" y="598" width="8"  height="8"  fill="#2a0c0c"/>

  <!-- ── TEXT GROUP — horizontally + vertically centered ─── -->

  <!-- Title "Stay Dead" — font-size 140, baseline y=296 -->
  <text x="600" y="296"
    text-anchor="middle"
    font-family="'Tiny5', sans-serif"
    font-size="140" font-weight="400"
    fill="#CC0000" stroke="#000000" stroke-width="9"
    paint-order="stroke fill" letter-spacing="3">Stay Dead</text>

  <!-- Blood drops — proportional to font-size 140, positions scaled from logo logo -->
  <!-- Each at a different stage of the fall animation: varying Y offset + opacity  -->
  <!-- x positions derived from logo drop coords scaled 140/72x to font-size       -->
  <!-- Drop 1 x=363 — 14% through fall, early -->
  <use href="#drop" transform="translate(363, 309)" opacity="0.90"/>
  <!-- Drop 2 x=522 — 68% through fall, late -->
  <use href="#drop" transform="translate(522, 321)" opacity="0.46"/>
  <!-- Drop 3 x=616 — 35% through fall, mid -->
  <use href="#drop" transform="translate(616, 314)" opacity="0.72"/>
  <!-- Drop 4 x=748 — 82% through fall, nearly gone -->
  <use href="#drop" transform="translate(748, 324)" opacity="0.24"/>
  <!-- Drop 5 x=884 — 48% through fall, mid-late -->
  <use href="#drop" transform="translate(884, 317)" opacity="0.60"/>

  <!-- Subtitle — font-size 34, baseline y=386 -->
  <text x="600" y="386"
    text-anchor="middle"
    font-family="'Tiny5', sans-serif"
    font-size="34" font-weight="400"
    fill="#8b5555" stroke="#000000" stroke-width="2"
    paint-order="stroke fill" letter-spacing="2">A dark roguelike RPG.</text>

  <!-- Credit — font-size 26, baseline y=425 -->
  <text x="600" y="425"
    text-anchor="middle"
    font-family="'Tiny5', sans-serif"
    font-size="26" font-weight="400"
    fill="#5a3838" stroke="#000000" stroke-width="1.5"
    paint-order="stroke fill" letter-spacing="2">by IGPenguin</text>

</svg>