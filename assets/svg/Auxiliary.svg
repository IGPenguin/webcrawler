<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="naturalNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.04"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="400" height="400" fill="#202020"/>
  <rect width="400" height="400" filter="url(#naturalNoise)" opacity="0.3"/>
  
  <style>
    .grid { stroke: #2a2a2a; stroke-width: 1; opacity: 0.3; }
  </style>
  <line class="grid" x1="0" y1="50" x2="200" y2="50"/>
  <line class="grid" x1="0" y1="100" x2="200" y2="100"/>
  <line class="grid" x1="50" y1="0" x2="50" y2="200"/>
  <line class="grid" x1="100" y1="0" x2="100" y2="200"/>
</svg>