<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="nebula1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0a0a1a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#120812" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>
    <filter id="naturalNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.08"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- Deep Space Base -->
  <rect width="400" height="400" fill="#050508"/>
  <rect width="400" height="400" fill="url(#nebula1)"/>
  <rect width="400" height="400" fill="url(#nebula2)"/>
  <rect width="400" height="400" filter="url(#naturalNoise)" opacity="0.4"/>

  <style>
    .star { fill: white; opacity: 0.3; }
    .twinkle { animation: twinkle 8s infinite ease-in-out; }
    .distant { fill: #889; opacity: 0.1; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.2); }
    }
  </style>

  <!-- Starfield Layer 1 (Static Distant) - Kept away from extreme edges -->
  <circle class="distant" cx="50" cy="80" r="0.5"/>
  <circle class="distant" cx="150" cy="40" r="0.7"/>
  <circle class="distant" cx="250" cy="180" r="0.4"/>
  <circle class="distant" cx="350" cy="320" r="0.6"/>
  <circle class="distant" cx="100" cy="250" r="0.5"/>
  <circle class="distant" cx="200" cy="350" r="0.8"/>
  <circle class="distant" cx="300" cy="100" r="0.4"/>
  <circle class="distant" cx="30" cy="370" r="0.7"/>

  <!-- Starfield Layer 2 (Twinkling) - Kept away from extreme edges -->
  <circle class="star twinkle" cx="120" cy="150" r="1"/>
  <circle class="star twinkle" cx="280" cy="50" r="0.8" style="animation-delay: -1.5s;"/>
  <circle class="star twinkle" cx="340" cy="220" r="1.2" style="animation-delay: -3s;"/>
  <circle class="star twinkle" cx="60" cy="330" r="0.9" style="animation-delay: -0.5s;"/>
  <circle class="star twinkle" cx="190" cy="280" r="1.1" style="animation-delay: -2.2s;"/>
  <circle class="star twinkle" cx="230" cy="370" r="0.7" style="animation-delay: -3.8s;"/>
</svg>